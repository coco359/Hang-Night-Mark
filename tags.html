<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>私人笔记库｜在线可编辑保存</title>
    <style>
        *{margin:0;padding:0;box-sizing:border-box;}
        body{font-family:system-ui,-apple-system;background:#f5f6f8;color:#333;line-height:1.7;}
        .wrap{max-width:1000px;margin:0 auto;padding:20px;}

        /* 密码页 */
        #pwdPage{height:100vh;display:flex;align-items:center;justify-content:center;background:#f5f6f8;}
        .pwd-box{background:#fff;padding:40px;border-radius:12px;box-shadow:0 4px 20px #00000015;width:90%;max-width:400px;text-align:center;}
        .pwd-box input{width:100%;padding:12px;margin:20px 0;border:1px #ddd solid;border-radius:6px;font-size:16px;}
        .pwd-box button{width:100%;padding:12px;background:#222;color:#fff;border:none;border-radius:6px;font-size:16px;cursor:pointer;}
        #err{color:red;font-size:14px;margin-top:10px;display:none;}

        /* 主页面 */
        #mainPage{display:none;}
        header{background:#fff;padding:24px;border-radius:12px;margin-bottom:20px;box-shadow:0 2px 10px #00000010;}
        nav{background:#fff;padding:20px;border-radius:12px;margin-bottom:20px;}
        nav ul{list-style:none;display:flex;gap:16px;flex-wrap:wrap;}
        nav a{color:#333;text-decoration:none;padding:6px 12px;background:#f3f3f3;border-radius:6px;}

        /* 编辑器面板 */
        .editor-card{background:#fff;padding:24px;border-radius:12px;margin-bottom:24px;box-shadow:0 2px 10px #00000010;}
        .editor-card h3{margin-bottom:16px;}
        select,input,textarea{width:100%;padding:10px;margin-bottom:12px;border:1px #ddd solid;border-radius:6px;font-size:15px;}
        textarea{min-height:120px;resize:vertical;}
        .save-btn{background:#222;color:#fff;border:none;padding:10px 20px;border-radius:6px;cursor:pointer;}

        /* 笔记列表 */
        .folder{background:#fff;padding:20px;border-radius:12px;margin-bottom:20px;}
        .folder h2{margin-bottom:16px;padding-bottom:10px;border-bottom:1px #eee solid;}
        .note-item{padding:16px;background:#f8f9fa;border-radius:8px;margin-bottom:12px;}
        .note-item h4{margin-bottom:6px;}
        .tags{font-size:12px;color:#888;margin-top:8px;}
    </style>
</head>
<body>

<!-- 密码页面 -->
<div id="pwdPage">
    <div class="pwd-box">
        <h2>私人笔记库</h2>
        <p>请输入密码解锁</p>
        <input type="password" id="pwdInput" placeholder="输入密码">
        <button onclick="checkPwd()">进入笔记库</button>
        <div id="err">密码错误</div>
    </div>
</div>

<!-- 主页面：编辑+查看一体化 -->
<div id="mainPage" class="wrap">
    <header>
        <h1>私人笔记库</h1>
        <p>焦虑思考 | 社会观察 | 创作素材</p>
    </header>

    <!-- 在线编辑区（核心：网页直接写、直接存） -->
    <div class="editor-card">
        <h3>📝 新建笔记（网页直接编辑自动保存）</h3>
        <select id="cateSelect">
            <option value="folder1">01_自我焦虑与和解</option>
            <option value="folder2">02_社会现象观察</option>
            <option value="folder3">03_创作素材库存</option>
        </select>
        <input id="noteTitle" placeholder="笔记标题">
        <textarea id="noteContent" placeholder="在这里写下你的思考、感悟、观察..."></textarea>
        <input id="noteTags" placeholder="标签，用空格分隔 例如：焦虑 内卷">
        <button class="save-btn" onclick="saveNote()">一键保存笔记</button>
    </div>

    <!-- 分类笔记展示区 -->
    <div class="folder" id="folder1">
        <h2>01_自我焦虑与和解</h2>
        <div id="list1"></div>
    </div>

    <div class="folder" id="folder2">
        <h2>02_社会现象观察</h2>
        <div id="list2"></div>
    </div>

    <div class="folder" id="folder3">
        <h2>03_创作素材库存</h2>
        <div id="list3"></div>
    </div>
</div>

<script>
// 密码
const correctPwd = "evilscrew";
function checkPwd(){
    let val = document.getElementById("pwdInput").value;
    if(val === correctPwd){
        document.getElementById("pwdPage").style.display = "none";
        document.getElementById("mainPage").style.display = "block";
        renderAllNotes();
    }else{
        let err = document.getElementById("err");
        err.style.display = "block";
        setTimeout(()=>err.style.display="none",2500);
    }
}

// 读写本地存储
function getNotes(){
    let raw = localStorage.getItem("myPrivateNotes");
    return raw ? JSON.parse(raw) : [];
}
function setNotes(arr){
    localStorage.setItem("myPrivateNotes",JSON.stringify(arr));
}

// 保存新笔记
function saveNote(){
    let cate = document.getElementById("cateSelect").value;
    let title = document.getElementById("noteTitle").value.trim();
    let content = document.getElementById("noteContent").value.trim();
    let tags = document.getElementById("noteTags").value;
    if(!title||!content){alert("标题和内容不能为空");return;}

    let notes = getNotes();
    notes.push({
        cate,title,content,tags,time:new Date().toLocaleString()
    });
    setNotes(notes);

    // 清空输入框
    document.getElementById("noteTitle").value = "";
    document.getElementById("noteContent").value = "";
    document.getElementById("noteTags").value = "";

    renderAllNotes();
    alert("保存成功！刷新页面内容也不会丢失");
}

// 渲染全部笔记
function renderAllNotes(){
    let notes = getNotes();
    document.getElementById("list1").innerHTML = "";
    document.getElementById("list2").innerHTML = "";
    document.getElementById("list3").innerHTML = "";

    notes.forEach(item=>{
        let html = `
        <div class="note-item">
            <h4>${item.title}</h4>
            <p>${item.content}</p>
            <div class="tags">${item.time}｜${item.tags}</div>
        </div>
        `;
        if(item.cate==="folder1") document.getElementById("list1").innerHTML += html;
        if(item.cate==="folder2") document.getElementById("list2").innerHTML += html;
        if(item.cate==="folder3") document.getElementById("list3").innerHTML += html;
    });
}
</script>

</body>
</html>
